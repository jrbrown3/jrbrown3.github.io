<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.R. Brown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf8;
    --ink: #111111;
    --muted: #666666;
    --line: #e3e1dd;
    --node: #d8d5cf;
    --accent: #0f172a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }

  /* background network graphic, anchored to the right side */
  .network {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: 46%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.55;
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1024px;
    padding: 40px 24px;
    margin: 0 auto;
  }

  .card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 48px;
  }

  .text {
    flex: 1 1 520px;
    min-width: 0;
  }

  .name {
    font-family: "Inter", sans-serif;
    font-size: 96px;
    font-weight: 600;
    line-height: 0.95;
    letter-spacing: -0.06em;
    color: var(--ink);
  }

  .title {
    margin-top: 18px;
    font-size: 1.05rem;
    color: var(--muted);
    font-weight: 500; /* Label: 500 */
    letter-spacing: 0.01em;
  }

  .title .dot {
    margin: 0 10px;
    color: #c9c6c0;
  }

  .bio {
    margin-top: 22px;
    max-width: 420px;
    font-size: 1.05rem;
    line-height: 1.55;
    font-weight: 400; /* Body text: 400 */
    color: #3a3a3a;
  }

  .section-heading {
    font-weight: 600; /* Section headings: 600 */
  }

  .links {
    margin-top: 32px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 22px;
    border-radius: 5px;
    font-size: 0.98rem;
    font-weight: 500; /* Label: 500 */
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn:hover { transform: translateY(-1px); }
  .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn.solid {
    background: var(--accent);
    color: #ffffff;
    border: 1px solid var(--accent);
  }

  .btn.solid:hover {
    background: #1c2940;
    border-color: #1c2940;
  }

  .btn.outline {
    background: transparent;
    color: var(--ink);
    border: 1px solid #d8d6d1;
  }

  .btn.outline:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn.logo {
    background: transparent;
    border: 1px solid #d8d6d1;
    padding: 12px 20px;
  }

  .btn.logo:hover {
    border-color: var(--accent);
  }

  .btn.logo img {
    height: 18px;
    width: auto;
    display: block;
  }

  .icon {
    width: 18px;
    height: 18px;
    display: inline-flex;
    flex-shrink: 0;
  }

  .icon svg { width: 100%; height: 100%; }

  .portrait-wrap {
    flex: 0 0 auto;
    position: relative;
    width: clamp(220px, 26vw, 360px);
    height: clamp(220px, 26vw, 360px);
  }

  .portrait {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: #d9d6d0;
    box-shadow: 0 20px 40px -16px rgba(0,0,0,0.18);
  }

  .portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @media (max-width: 760px) {
    .card {
      flex-direction: column;
      text-align: center;
      gap: 32px;
    }
    .text { display: flex; flex-direction: column; align-items: center; order: 2; }
    .portrait-wrap { order: 1; }
    .bio { max-width: 360px; }
    .links { justify-content: center; }
    .network { width: 100%; opacity: 0.35; }
    .name { font-size: 56px; }
  }

  @media (max-width: 420px) {
    .name { font-size: 42px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
